<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Тест полосы</title>
<style>
  html { background: #E0115F; }            /* МАЛИНОВЫЙ = html */
  body { margin: 0; background: #1E90FF; } /* СИНИЙ = body */
  #app { position: fixed; inset: 0; height: 100lvh;
         background: repeating-linear-gradient(45deg,#2E8B57 0 20px,#3CB371 20px 40px); } /* ЗЕЛЁНЫЙ полосатый = наш экран */
  #info { position: fixed; left: 12px; right: 12px; top: 40%; padding: 14px; border-radius: 12px;
          background: rgba(0,0,0,.75); color: #fff; font: 15px/1.5 -apple-system, sans-serif; }
  #probe { position: fixed; bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="app"></div>
<div id="probe"></div>
<div id="info">Загрузка…</div>
<script>
  const p = document.getElementById('probe');
  const sb = getComputedStyle(p).paddingBottom;
  const vv = window.visualViewport ? Math.round(visualViewport.height) : '—';
  document.getElementById('info').innerHTML =
    '<b>Какого цвета полоса внизу?</b><br>' +
    'зелёная полоса до самого низа → всё ок<br>' +
    'синяя → body короче экрана<br>' +
    'малиновая → html короче экрана<br>' +
    'чёрная/белая (не из этих цветов) → нативная оболочка<br><br>' +
    'screen.height: ' + screen.height + '<br>' +
    'innerHeight: ' + innerHeight + '<br>' +
    'visualViewport: ' + vv + '<br>' +
    'safe-area bottom: ' + sb + '<br>' +
    'standalone: ' + (navigator.standalone === true) + '<br>' +
    'UA: ' + navigator.userAgent.slice(0, 90);
</script>
</body>
</html>
