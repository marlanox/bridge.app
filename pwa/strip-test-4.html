<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Тест 4 — четыре техники рядом</title>
<style>
  /* Тест 3 показал: даже увеличенный до 150px "bottom: calc(-1 * env(...) - 150px)"
     всё равно не дотягивает зелёный до низа — и это НЕ эффект прокрутки (html/body
     уже были заблокированы в тесте 3). Значит сама техника "bottom: calc(отрицательное
     значение с env())" на этом телефоне не работает, а не просто взят маленький запас.
     Этот тест ставит рядом 4 РАЗНЫЕ техники, каждая — своя узкая вертикальная полоса
     на весь экран, чтобы одним скриншотом увидеть, какая из них реально доходит до
     низа, без необходимости присылать скриншот на каждую технику по отдельности. */
  html,body { margin: 0; padding: 0; background: #1E90FF; /* СИНИЙ = ничего не доехало */
    overflow: hidden; overscroll-behavior: none; height: 100%; }

  /* А — СТАРАЯ техника (уже в приложении): bottom: calc(-1 * env() - 150px) */
  #a { position: fixed; top: 0; left: 0; width: 25%;
       bottom: calc(-1 * env(safe-area-inset-bottom) - 150px);
       background: repeating-linear-gradient(45deg,#C2410C 0 16px,#EA580C 16px 32px); }

  /* Б — высота вместо bottom: top:0 + height: calc(100% + 300px), без env() вовсе */
  #b { position: fixed; top: 0; left: 25%; width: 25%;
       height: calc(100% + 300px);
       background: repeating-linear-gradient(45deg,#15803D 0 16px,#22C55E 16px 32px); }

  /* В — то же самое, но через 100vh вместо проценте от контейнера */
  #c { position: fixed; top: 0; left: 50%; width: 25%;
       height: calc(100vh + 300px);
       background: repeating-linear-gradient(45deg,#0E7490 0 16px,#22D3EE 16px 32px); }

  /* Г — высота в пикселях, посчитанная в JS из window.innerHeight (без calc/env вообще) */
  #d { position: fixed; top: 0; left: 75%; width: 25%;
       background: repeating-linear-gradient(45deg,#6D28D9 0 16px,#A855F7 16px 32px); }

  #labels { position: fixed; top: 0; left: 0; right: 0; display: flex; font: 700 11px/1.3 -apple-system, sans-serif;
            color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; pointer-events: none; }
  #labels div { width: 25%; padding-top: 50px; }

  #info { position: fixed; left: 10px; right: 10px; top: 38%; padding: 12px; border-radius: 12px;
          background: rgba(0,0,0,.8); color: #fff; font: 13px/1.5 -apple-system, sans-serif; z-index: 6; }
</style>
</head>
<body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
<div id="labels"><div>А bottom:calc</div><div>Б height:calc %</div><div>В height:calc vh</div><div>Г JS px</div></div>
<div id="info">Загрузка…</div>
<script>
  const d = document.getElementById('d');
  d.style.height = (window.innerHeight + 300) + 'px';

  const vv = window.visualViewport ? Math.round(visualViewport.height) : '—';
  document.getElementById('info').innerHTML =
    '<b>ТЕСТ 4.</b> НЕ трогайте экран, сразу скриншот.<br>' +
    'Каждая из 4 полос — своя техника. Синий внизу под какой-то полосой = ' +
    'та техника не работает на этом телефоне. Какая полоса (А/Б/В/Г) не доходит ' +
    'до низа, а какая доходит — это и есть ответ.<br><br>' +
    'screen.height: ' + screen.height + ' · innerHeight: ' + innerHeight +
    ' · visualViewport: ' + vv + '<br>standalone: ' + (navigator.standalone === true);
</script>
</body>
</html>
