name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compile (simulator build, unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: Scripts/ci_build.sh
        env:
          CONFIGURATION: Debug
