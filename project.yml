name: Bridge
options:
  bundleIdPrefix: com.bridge.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - path: Bridge
    info:
      path: Bridge/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Bridge uses your microphone to record short optional voice keepsakes at the end of a session."
        NSPhotoLibraryAddUsageDescription: "Bridge saves \"Today's Mark\" to your photo library when you tap Save to gallery."
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bridge.app.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
