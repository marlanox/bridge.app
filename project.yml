name: Bridge
options:
  bundleIdPrefix: com.bridge.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
schemes:
  Bridge:
    build:
      targets:
        Bridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BridgeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - path: Bridge
    info:
      path: Bridge/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Bridge uses your microphone to record short optional voice keepsakes at the end of a session."
        NSPhotoLibraryAddUsageDescription: "Bridge saves \"Today's Mark\" to your photo library when you tap Save to gallery."
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bridge.app.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    entitlements:
      path: Bridge/Bridge.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bridge.app.ios
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.bridge.app.ios
  BridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BridgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bridge.app.ios.uitests
    dependencies:
      - target: Bridge
