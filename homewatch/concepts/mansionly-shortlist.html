<title>Mansionly Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@800&display=swap">
<style>
/* Clean shortlist: six finalists, one per row, large. No roofs anywhere. Navy, white, and the app icon. */
:root{--bg:#F7F6F3;--card:#FFFFFF;--ink:#0F1E33;--muted:#5A6272;--line:#E6E3DC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1222;--card:#101B30;--ink:#EEF1F6;--muted:#93A0B4;--line:#22304A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1222;--card:#101B30;--ink:#EEF1F6;--muted:#93A0B4;--line:#22304A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Inter",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:56px 96px;display:grid;gap:48px}
h1{font:800 clamp(30px,4.4vw,46px)/1.05 "Manrope",sans-serif;letter-spacing:-.04em;margin:0}
p{margin:0}
.intro{display:grid;gap:12px;max-width:640px}
.intro p{color:var(--muted)}
.opt{display:grid;gap:14px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.code{font:800 14px/1 "Manrope",sans-serif;letter-spacing:.04em;color:var(--muted)}
.head b{font:800 20px/1.2 "Manrope",sans-serif;letter-spacing:-.02em}
.head span{color:var(--muted);font-size:14px;flex-basis:100%}
.row{display:grid;grid-template-columns:1fr 1fr 170px;border:1px solid var(--line)}
@media (max-width:820px){.row{grid-template-columns:1fr 1fr}.ic{grid-column:1/-1}}
@media (max-width:540px){.row{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;justify-content:center;min-height:200px;padding:28px 14px;overflow:hidden}
.n{background:#0E2343}
.w{background:#FFFFFF}
.ic{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);padding:18px}
.ic svg{display:block}
.lk{white-space:nowrap;line-height:1;display:inline-flex;align-items:center;font:800 clamp(34px,4.2vw,50px)/1 "Manrope",sans-serif;letter-spacing:-.05em;color:var(--r)}
.lk>svg{height:.98em;width:.98em;margin-right:.24em;flex:none;color:var(--s)}
.fm{color:var(--m)}
.ko{background:var(--m);color:var(--kb);padding:.02em .07em .13em;margin-right:.03em}
.dt{color:var(--d)}
.rm{position:relative;display:inline-block}
.rm svg{position:absolute;left:-.05em;top:-.4em;width:1.1em;height:.4em;overflow:visible}
.foot{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:18px}
</style>

<div class="wrap">
  <header class="intro">
    <h1>mansionly. shortlist</h1>
    <p>Everything you liked, reduced to ten clean finalists. No roof on the shield; options 07–10 put the gold roof over the m. Each is shown on navy, on white, and as the app icon.</p>
  </header>
  <div id="list" style="display:grid;gap:48px"></div>
  <p class="foot">Choose one. I then make the final files and rebuild the whole site with it.</p>
</div>

<script>
var NAVY = '#0E2343', IVORY = '#EFE7D6', WHITE = '#FFFFFF', GOLD = '#C6A867', GOLDD = '#A88A4E', SKY = '#A3B7D6', SLATE = '#7D8AA0';
var kh = function (cx, cy, s, f) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (11 * s) + '" fill="' + f + '"/><path d="M' + (cx - 6 * s) + ' ' + (cy + 6 * s) + 'L' + (cx - 10 * s) + ' ' + (cy + 28 * s) + 'h' + (20 * s) + 'L' + (cx + 6 * s) + ' ' + (cy + 6 * s) + 'z" fill="' + f + '"/>'; };
var SH = 'M12 4h76v42c0 26-17 41-38 50C29 87 12 72 12 46z';
var shield = function (bg) { return '<path d="' + SH + '" fill="currentColor"/>' + kh(50, 38, 1.1, bg); };
var shieldGold = function (bg, a) { return '<path d="' + SH + '" fill="currentColor"/>' + kh(50, 38, 1.1, a); };
var CONTRAST = [{ s: WHITE, m: WHITE, r: SKY, d: GOLD }, { s: NAVY, m: NAVY, r: SLATE, d: GOLDD }];
var GOLDM = [{ s: IVORY, m: GOLD, r: IVORY, d: GOLD }, { s: NAVY, m: GOLDD, r: NAVY, d: GOLDD }];
var KO = [{ s: IVORY, m: GOLD, r: IVORY, d: GOLD, kb: NAVY }, { s: NAVY, m: NAVY, r: NAVY, d: GOLDD, kb: WHITE }];
var OPTS = [
  ['01', 'Name only, contrast m', 'The m is the brightest letter, the rest is quieter, gold period. No symbol: the cleanest and most timeless.', null, CONTRAST, 0],
  ['02', 'Name only, gold m', 'Gold at the start and at the end of the name. Warm and rich.', null, GOLDM, 0],
  ['03', 'Keyhole shield + contrast m', 'The plain shield (no roof) with the bright m.', shield, CONTRAST, 0],
  ['04', 'Keyhole shield + gold m', 'Your favourite from the first-letter board, now without the roof.', shield, GOLDM, 0],
  ['05', 'Gold keyhole shield + contrast m', 'Solid shield with a gold keyhole; the gold repeats in the period.', shieldGold, CONTRAST, 0],
  ['06', 'Name only, m knocked out', 'The m cut out of a block in the background colour, like a stamp.', null, KO, 1],
  ['07', 'Roof over the m, one colour name', 'The gold roof sits on the first letter; the rest of the name is one calm colour.', null, [{ s: IVORY, m: IVORY, r: IVORY, d: GOLD }, { s: NAVY, m: NAVY, r: NAVY, d: GOLDD }], 0, 1],
  ['08', 'Roof over the m, contrast m', 'Bright m under the gold roof, the rest quieter.', null, CONTRAST, 0, 1],
  ['09', 'Roof over the m, gold m', 'Roof, first letter and period all in gold.', null, GOLDM, 0, 1],
  ['10', 'Keyhole shield + roof over the m', 'The shield stays plain (no roof); the roof moves to the m. The most detailed option.', shield, CONTRAST, 0, 1]
];
var lock = function (o, c, bg, a) {
  var sym = o[3] ? '<svg viewBox="0 0 100 100" aria-hidden="true">' + o[3](bg, a) + '</svg>' : '';
  return '<span class="lk" style="--s:' + c.s + ';--m:' + c.m + ';--r:' + c.r + ';--d:' + c.d + ';--kb:' + (c.kb || bg) + '">' + sym + (o[6] ? '<span class="rm fm"><svg viewBox="0 0 100 40" aria-hidden="true"><path d="M4 36 50 6l46 30" fill="none" stroke="' + c.d + '" stroke-width="11" stroke-linejoin="miter"/></svg>m</span>' : '<span class="' + (o[5] ? 'ko' : 'fm') + '">m</span>') + 'ansionly<span class="dt">.</span></span>';
};
var icon = function (o, size, bg, fg, a, mcol) {
  if (o[6] && o[3]) o = [o[0], o[1], o[2], null, o[4], 0, 1];
  var r = 'border-radius:' + (size > 24 ? 22 : 4) + '%;' + (bg === WHITE ? 'box-shadow:inset 0 0 0 1px #DAD6CE' : '');
  var inner = o[3] ? '<g transform="translate(17,16) scale(.66)" style="color:' + fg + '">' + o[3](bg, a) + '</g>'
    : (o[6] ? '<path d="M24 40 48 22l24 18" fill="none" stroke="' + a + '" stroke-width="7" stroke-linejoin="miter"/>' : '') + '<text x="46" y="' + (o[6] ? 76 : 68) + '" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="' + (o[6] ? 54 : 64) + '" letter-spacing="-3" fill="' + mcol + '">m</text><rect x="78" y="60" width="9" height="9" fill="' + a + '"/>';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" aria-hidden="true" style="' + r + '"><rect width="100" height="100" fill="' + bg + '"/>' + inner + '</svg>';
};
document.getElementById('list').innerHTML = OPTS.map(function (o) {
  return '<section class="opt"><div class="head"><span class="code">' + o[0] + '</span><b>' + o[1] + '</b><span>' + o[2] + '</span></div>' +
    '<div class="row"><div class="tile n">' + lock(o, o[4][0], NAVY, GOLD) + '</div><div class="tile w">' + lock(o, o[4][1], WHITE, GOLDD) + '</div>' +
    '<div class="ic">' + icon(o, 64, NAVY, IVORY, GOLD, o[4][0].m) + icon(o, 64, WHITE, NAVY, GOLDD, o[4][1].m) + icon(o, 22, NAVY, IVORY, GOLD, o[4][0].m) + '</div></div></section>';
}).join('');
</script>
